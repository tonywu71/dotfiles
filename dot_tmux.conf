# Let Shift+Enter and other modifier keys reach apps such as Claude Code
set -g extended-keys on
# Tell tmux that iTerm2 can send extended keys
set -as terminal-features ',xterm*:extkeys'
# Send them to apps in the csi-u format that Claude Code reads (tmux 3.5+)
set -s extended-keys-format csi-u

# Make Esc instant instead of waiting 500 ms for a key sequence
set -sg escape-time 10

# Pass 24-bit color through to iTerm2
set -as terminal-features ',xterm-256color:RGB'

# Claude Code caps itself at 256 colors inside tmux unless this is set
# https://github.com/anthropics/claude-code/issues/36785
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1
