# Let Shift+Enter and other modifier keys reach apps such as Claude Code
set -g extended-keys on

# Pass 24-bit color through to iTerm2
set -as terminal-features ',xterm-256color:RGB'

# Claude Code caps itself at 256 colors inside tmux unless this is set
# https://github.com/anthropics/claude-code/issues/36785
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1
